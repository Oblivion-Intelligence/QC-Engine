[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcengine"
version = "0.1.0"
description = "Quantitative components for market data ingestion and processing."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.22.0",
    "yfinance>=0.2.52",
]

[tool.setuptools.packages.find]
where = ["src"]
